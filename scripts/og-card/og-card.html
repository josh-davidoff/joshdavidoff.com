<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>og card source</title>
<!-- Source for assets/og-card.png (1200x630). Render command: AGENTS.md, "Link-preview card". -->
<style>
  @font-face { font-family: "Apfel Grotezk"; src: url("/assets/fonts/ApfelGrotezk-Regular.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Apfel Grotezk"; src: url("/assets/fonts/ApfelGrotezk-Mittel.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "Apfel Grotezk"; src: url("/assets/fonts/ApfelGrotezk-Fett.woff2") format("woff2"); font-weight: 700; }
  :root { --bg: #0c4927; --mustard: #f4c343; --cream: #f6f0dc; --sage: #96ab8d; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
  body { position: relative; font-family: "Apfel Grotezk", sans-serif; }
  .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 10px; background: var(--mustard); }
  .ring { position: absolute; border-radius: 50%; border: 2px solid var(--mustard); box-sizing: border-box; }
  .ring.inner { left: 1035px; top: 40px; width: 110px; height: 110px; opacity: 0.3; }
  .ring.outer { left: 993px; top: -2px; width: 194px; height: 194px; opacity: 0.12; }
  .name { position: absolute; left: 78px; top: 132px; margin: 0; color: var(--cream); font-size: 94px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  .tag { position: absolute; left: 80px; top: 256px; margin: 0; color: var(--mustard); font-size: 31px; font-weight: 500; line-height: 1.2; }
  .tag .sep { padding: 0 14px; }
  .sub { position: absolute; left: 80px; top: 316px; margin: 0; color: var(--sage); font-size: 23px; font-weight: 400; line-height: 1.2; }
  .rule { position: absolute; left: 80px; top: 500px; width: 540px; height: 2px; background: var(--mustard); }
  .url { position: absolute; left: 80px; top: 528px; margin: 0; color: var(--mustard); font-size: 19px; font-weight: 500; letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="bar"></div>
  <div class="ring outer"></div>
  <div class="ring inner"></div>
  <p class="name">Josh Davidoff</p>
  <p class="tag">Grantmaking Operations<span class="sep">·</span>Systems<span class="sep">·</span>Practical AI</p>
  <p class="sub">For mission-driven organizations</p>
  <div class="rule"></div>
  <p class="url">joshdavidoff.com</p>
</body>
</html>
